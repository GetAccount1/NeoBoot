[global]
default=0
timeout=0
show_timeout=true
font=assets/NotoSans-Regular.ttf
controller_style=auto
icons=builtin-controller

[entry "Restart to Other OS Boot"]
type=firmware-volumes

[entry "Restart to Select Boot Options"]
type=reboot-menu

[entry "Install kernel"]
type=install-kernel

[entry "Scanning disk"]
type=scan-disk

[entry "Restart system"]
type=reboot

[entry "Shutdown device"]
type=shutdown
